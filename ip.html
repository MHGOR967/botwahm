<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص عنوان الـ IP والبروكسي | Fokhm Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6 text-center">
        
        <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg shadow-blue-500/20">
            <i class="fa-solid fa-network-wired"></i>
        </div>

        <div class="space-y-1">
            <h1 class="text-xl font-black text-white">فاحص الشبكة والـ IP</h1>
            <p class="text-xs text-slate-400">اضغط على الزر أدناه لجلب عنوان الـ IP الحالي والتحقق من الاستجابة.</p>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-2">
            <span class="text-[10px] text-slate-500 font-mono block">CURRENT_IP_DETECTED</span>
            <div id="ipResult" class="text-lg font-mono font-bold text-emerald-400 tracking-wider">
                000.000.000.000
            </div>
        </div>

        <button onclick="checkIpAddress()" id="checkBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-xs transition-all shadow-lg shadow-blue-600/30">
            فحص وإرسال طلب جديد
        </button>

        <div class="text-[10px] text-slate-500 border-t border-slate-800 pt-3">
            Fokhm Security Tools - @HackWahm
        </div>

    </div>

    <script>
        async function checkIpAddress() {
            const btn = document.getElementById('checkBtn');
            const ipBox = document.getElementById('ipResult');
            
            btn.disabled = true;
            btn.innerText = 'جاري الفحص...';
            ipBox.innerText = '... جاري الجلب';

            try {
                // استخدام خدمة عامة لجلب الـ IP
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                
                ipBox.innerText = data.ip;
            } catch (error) {
                ipBox.innerText = 'فشل الاتصال!';
            } finally {
                btn.disabled = false;
                btn.innerText = 'فحص وإرسال طلب جديد';
            }
        }

        // فحص تلقائي عند فتح الصفحة
        window.onload = checkIpAddress;
    </script>
</body>
</html>
