<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الأذكياء | Fokhm Server</title>
    
    <meta property="og:title" content="لعبة الأذكياء والتحدي الرقمي">
    <meta property="og:description" content="اختبر ذكاءك في تحدي الـ 10 أسئلة واجتز السيرفر بنجاح...">
    <meta property="og:image" content="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=1200&auto=format&fit=crop&q=80">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #030712; }
        .server-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
        .glow-effect { box-shadow: 0 0 25px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-between p-4 relative overflow-x-hidden">

    <!-- خلفية تشبه سيرفر البيانات والشبكات -->
    <div class="absolute inset-0 opacity-10 pointer-events-none bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:24px_24px]"></div>

    <div class="w-full max-w-md my-auto server-gradient border border-slate-800/80 rounded-3xl p-6 glow-effect space-y-5 relative z-10">
        
        <!-- رأس السيرفر الشكلي -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-3 text-[11px] text-slate-400 font-mono">
            <span class="flex items-center space-x-1.5 space-x-reverse text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span>SERVER_ACTIVE</span>
            </span>
            <span>المطور وهم </span>
        </div>

        <!-- شاشة اختيار الأقسام -->
        <div id="categoryScreen" class="space-y-4">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center mx-auto text-xl text-indigo-400 shadow-lg">
                    <i class="fa-solid fa-server"></i>
                </div>
                <h1 class="text-xl font-black text-white">لعبة الأذكياء</h1>
                <p class="text-xs text-slate-400">اختر مسار التحدي (10 أسئلة حاسمة لاجتياز السيرفر)</p>
            </div>

            <div class="grid grid-cols-2 gap-2.5 pt-2">
                <button onclick="startSession('ألغاز وذكاء وتفكير عميق')" class="bg-slate-900 border border-slate-800 hover:border-indigo-500 p-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-brain text-indigo-400"></i>
                    <span>ألغاز وذكاء</span>
                </button>
                <button onclick="startSession('إسلاميات وتاريخ إسلامي وعقيدة')" class="bg-slate-900 border border-slate-800 hover:border-indigo-500 p-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-mosque text-emerald-400"></i>
                    <span>إسلاميات ودين</span>
                </button>
                <button onclick="startSession('رياضة عالمية وكرة قدم وبطولات')" class="bg-slate-900 border border-slate-800 hover:border-indigo-500 p-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-futbol text-amber-400"></i>
                    <span>رياضة عالمية</span>
                </button>
                <button onclick="startSession('تكنولوجيا وفضاء وعلوم حديثة')" class="bg-slate-900 border border-slate-800 hover:border-indigo-500 p-3 rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-microchip text-sky-400"></i>
                    <span>علوم وتكنولوجيا</span>
                </button>
            </div>
        </div>

        <!-- شاشة التحميل والاتصال بالسيرفر -->
        <div id="loadingScreen" class="hidden text-center py-12 space-y-4">
            <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <p class="text-xs text-slate-400 font-mono">جاري معالجة وجلب حزمة البيانات (سؤال <span id="currentLoadNum">1</span>/10)...</p>
        </div>

        <!-- شاشة اللعب والأسئلة -->
        <div id="quizContainer" class="hidden space-y-4">
            <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-2">
                <span class="bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded font-mono font-bold">السؤال <span id="qIndexNum">1</span>/10</span>
                <div class="space-x-3 space-x-reverse font-mono text-[11px]">
                    <span class="text-emerald-400">صح: <span id="correctCount">0</span></span>
                    <span class="text-rose-400">خطأ: <span id="wrongCount">0</span></span>
                </div>
            </div>

            <div id="questionText" class="text-sm font-bold text-slate-100 min-h-[70px] flex items-center justify-center text-center leading-relaxed">
                <!-- السؤال -->
            </div>

            <div id="optionsContainer" class="space-y-2.5">
                <!-- الخيارات -->
            </div>
        </div>

        <!-- شاشة النتائج واجتياز السيرفر (فوز / خسارة) -->
        <div id="resultContainer" class="hidden text-center space-y-4 py-4">
            <div id="resultIconBox" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto text-2xl shadow-lg">
                <!-- أيقونة النتيجة -->
            </div>
            <h2 id="resultTitle" class="text-lg font-black tracking-wide"></h2>
            <p id="finalScoreText" class="text-xs text-slate-300 leading-relaxed"></p>
            <div class="space-y-2 pt-2">
                <button onclick="restartGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-indigo-600/30 transition-all">
                    إعادة اختبار السيرفر
                </button>
                <button onclick="backToCategories()" class="w-full bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition-colors">
                    تغيير المسار
                </button>
            </div>
        </div>

    </div>

    <!-- حقوق المطور الثابتة -->
    <div class="w-full max-w-md text-center py-2 relative z-10">
        <a href="https://t.me/HackWahm" target="_blank" class="inline-flex items-center space-x-2 space-x-reverse bg-slate-900/90 border border-slate-800 hover:border-indigo-500/50 px-5 py-2.5 rounded-2xl text-xs text-slate-300 transition-all shadow-lg">
            <i class="fa-solid fa-code text-indigo-400"></i>
            <span>المطور: <span class="font-bold text-white">@HackWahm</span></span>
        </a>
    </div>

    <script>
        const apiKey = "";
        let selectedCategory = '';
        let currentStep = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        const totalQuestions = 10;

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'win') {
                    // نغمة احتفالية عند الفوز
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    setTimeout(() => osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.1), 100);
                    setTimeout(() => osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2), 200);
                    setTimeout(() => osc.frequency.setValueAtTime(880, ctx.currentTime + 0.3), 300);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                } else {
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        function startSession(category) {
            selectedCategory = category;
            currentStep = 1;
            correctAnswers = 0;
            wrongAnswers = 0;

            document.getElementById('categoryScreen').classList.add('hidden');
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('loadingScreen').classList.remove('hidden');
            document.getElementById('currentLoadNum').innerText = currentStep;

            fetchQuestion();
        }

        async function fetchQuestion(retries = 5, delay = 1000) {
            const promptText = `أنشئ سؤال مسابقات ذكي وممتع في تصنيف "${selectedCategory}" (السؤال رقم ${currentStep} من أصل 10). أجب بصيغة JSON حصراً بالشكل التالي:
{
  "q": "نص السؤال هنا",
  "options": ["خيار 1", "خيار 2", "خيار 3", "خيار 4"],
  "answer": رقم فهرس الإجابة الصحيحة من 0 إلى 3
}`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: { responseMimeType: "application/json" }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('API Error');

                const result = await response.json();
                const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!rawText) throw new Error('Empty');

                const qData = JSON.parse(rawText);
                renderQuestion(qData);
            } catch (error) {
                if (retries > 0) {
                    setTimeout(() => fetchQuestion(retries - 1, delay * 2), delay);
                } else {
                    alert('حدث خطأ في الاتصال بالسيرفر. يرجى المحاولة لاحقاً.');
                    backToCategories();
                }
            }
        }

        function renderQuestion(qObj) {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');

            document.getElementById('qIndexNum').innerText = currentStep;
            document.getElementById('correctCount').innerText = correctAnswers;
            document.getElementById('wrongCount').innerText = wrongAnswers;
            document.getElementById('questionText').innerText = qObj.q;

            const optionsBox = document.getElementById('optionsContainer');
            optionsBox.innerHTML = '';

            qObj.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-slate-900 border border-slate-800 hover:border-indigo-500 text-slate-200 text-xs font-semibold py-3.5 px-4 rounded-xl transition-all text-right shadow-md";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(idx === qObj.answer, btn);
                optionsBox.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect, btnElement) {
            const buttons = document.getElementById('optionsContainer').getElementsByTagName('button');
            for (let b of buttons) b.disabled = true;

            if (isCorrect) {
                playSound('correct');
                btnElement.classList.add('bg-emerald-600/30', 'border-emerald-500', 'text-emerald-300');
                correctAnswers++;
            } else {
                playSound('wrong');
                btnElement.classList.add('bg-rose-600/30', 'border-rose-500', 'text-rose-300');
                wrongAnswers++;
            }

            document.getElementById('correctCount').innerText = correctAnswers;
            document.getElementById('wrongCount').innerText = wrongAnswers;

            currentStep++;

            if (currentStep > totalQuestions) {
                setTimeout(showFinalResult, 1000);
            } else {
                setTimeout(() => {
                    document.getElementById('quizContainer').classList.add('hidden');
                    document.getElementById('loadingScreen').classList.remove('hidden');
                    document.getElementById('currentLoadNum').innerText = currentStep;
                    fetchQuestion();
                }, 900);
            }
        }

        function showFinalResult() {
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');

            const iconBox = document.getElementById('resultIconBox');
            const titleBox = document.getElementById('resultTitle');
            const descBox = document.getElementById('finalScoreText');

            // شرط الفوز: إذا كانت الإجابات الصحيحة أكثر من الخطأ أو النصف فأعلى (5 من 10 فأكثر)
            const isWinner = correctAnswers > wrongAnswers;

            if (isWinner) {
                playSound('win');
                iconBox.className = "w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center mx-auto text-2xl shadow-lg";
                iconBox.innerHTML = '<i class="fa-solid fa-trophy"></i>';
                titleBox.className = "text-lg font-black tracking-wide text-emerald-400";
                titleBox.innerText = "تهانينا! لقد اجتزت السيرفر بنجاح 🏆";
                descBox.innerText = `أداء استثنائي يا فخم! أجبت على ${correctAnswers} أسئلة صحيحة من أصل ${totalQuestions}. تم تأكيد تفوقك الذهني بنجاح.`;
            } else {
                playSound('wrong');
                iconBox.className = "w-16 h-16 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/40 flex items-center justify-center mx-auto text-2xl shadow-lg";
                iconBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
                titleBox.className = "text-lg font-black tracking-wide text-rose-400";
                titleBox.innerText = "فشل اجتياز السيرفر ⚠️";
                descBox.innerText = `للأسف يا فخم، أجبت على ${correctAnswers} صحيحة و ${wrongAnswers} خاطئة. حاول مرة أخرى لتثبت جدارتك!`;
            }
        }

        function restartGame() {
            startSession(selectedCategory);
        }

        function backToCategories() {
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('categoryScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
