<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمت العملية بنجاح</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        .icon { font-size: 60px; color: #28a745; margin-bottom: 20px; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 25px; padding: 12px 30px; background-color: #007bff; color: white; text-decoration: none; border-radius: 30px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h2>تمت العملية بنجاح!</h2>
        <p>لقد تم استلام طلبك ومعالجته بنجاح. سيتم تفعيل الخدمة على حسابك خلال الـ 24 ساعة القادمة.</p>
        <p><small>شكراً لاستخدامك خدماتنا الموثوقة.</small></p>
        <a href="https://google.com" class="btn">العودة للرئيسية</a>
    </div>
</body>
</html>
